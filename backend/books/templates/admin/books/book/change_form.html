{% extends "admin/change_form.html" %}
{% load admin_modify %}

{% block submit_buttons_bottom %}
  {{ block.super }}
  {% if original and original.status == "pending" %}
    <fieldset class="module aligned">
      <div class="form-row">
        <label for="id_rejection_reason">Rejection reason</label>
        <textarea id="id_rejection_reason" name="rejection_reason" rows="3" cols="60"></textarea>
      </div>
      <button type="submit" name="_reject" value="yes">Reject listing</button>
    </fieldset>
  {% endif %}
{% endblock %}

{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
  <h1>Reject selected listings</h1>
  <p>Enter the reason sellers should address before resubmitting.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% for book in queryset %}
      <input type="hidden" name="{{ action_checkbox_name }}" value="{{ book.pk }}">
    {% endfor %}
    <input type="hidden" name="action" value="reject">
    <input type="hidden" name="select_across" value="{{ select_across }}">
    <input type="hidden" name="confirm_reject" value="yes">
    <button type="submit" class="default">Reject selected listings</button>
    <a href="../">Cancel</a>
  </form>
{% endblock %}

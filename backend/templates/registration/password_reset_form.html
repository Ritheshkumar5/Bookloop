<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Reset password | BookLoop</title></head>
  <body>
    <main>
      <h1>Reset your password</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.email.errors }}
        <label for="{{ form.email.id_for_label }}">Email</label>
        {{ form.email }}
        <button type="submit">Send reset link</button>
      </form>
    </main>
  </body>
</html>
